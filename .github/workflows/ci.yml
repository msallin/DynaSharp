name: ci

on:
  pull_request:
  push:
    branches: [main, 'ci/**']
  # For the mutation job, see there. The other jobs run on this event too.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build, test, coverage
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs tags and history

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - run: dotnet tool restore
      - run: dotnet restore DynaSharp.slnx --locked-mode

      # Locked mode creates a lock file that is missing instead of failing, so a project added without one would pass.
      - name: Restore must not change the tree
        run: |
          changes=$(git status --porcelain)
          if [ -n "$changes" ]; then
            echo "Restore created or changed files; commit the lock files:"
            echo "$changes"
            exit 1
          fi

      # The build enforces the analyzers, the code style and, through IDE0055 and SA1518, the formatting. What is left of dotnet format is this: it sees line endings too, and needs no analyzer and no generator.
      - run: dotnet format whitespace DynaSharp.slnx --verify-no-changes --no-restore
      # Only what this job uses. The other projects of the solution compile in the jobs below: the integration tests, the sample and the benchmarks in integration, the AOT smoke test in aot.
      - run: dotnet build tests/DynaSharp.UnitTests -c Release --no-restore

      # The pages for users promise examples that compile, and nothing else builds them. One compilation takes all of them.
      - name: README and docs examples compile
        run: dotnet run build/ReadmeCheck.cs -- README.md src/DynaSharp.Testing/README.md docs/*.md

      # The solution also holds the integration tests, which need Docker and run in their own job.
      - name: Unit tests with coverage
        run: >
          dotnet test --project tests/DynaSharp.UnitTests -c Release --no-build
          --coverage --coverage-settings "$GITHUB_WORKSPACE/coverage.config" --coverage-output coverage.cobertura.xml

      - name: Coverage gate (100 % line and branch)
        run: dotnet run build/CoverageGate.cs -- TestResults/coverage.cobertura.xml 100

      - run: dotnet pack src/DynaSharp -c Release --no-build -o artifacts/packages
      - run: dotnet pack src/DynaSharp.Testing -c Release --no-build -o artifacts/packages

      # Packaging mistakes in the generator are silent: a package without it still builds. This restores DynaSharp from
      # artifacts/packages like a user would, checks that the compiler is given the generator from the package, and runs.
      - name: Package smoke test
        run: dotnet run --project tests/DynaSharp.PackageSmoke -c Release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: test-results
          path: TestResults/

  integration:
    name: Integration tests (Dynoxide, DynamoDB Local)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DYNASHARP_BACKENDS: dynoxide,dynamodb-local,fake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet restore tests/DynaSharp.IntegrationTests --locked-mode
      - run: dotnet build tests/DynaSharp.IntegrationTests -c Release --no-restore

      # Nothing runs the benchmarks in CI, and this is the one place that keeps them compiling.
      - run: dotnet restore benchmarks/DynaSharp.Benchmarks --locked-mode
      - run: dotnet build benchmarks/DynaSharp.Benchmarks -c Release --no-restore

      # The same tests run against both emulators and the in-memory fake; the images are pinned in tests/DynaSharp.IntegrationTests/Backends/*/Dockerfile.
      - name: Integration tests
        run: dotnet test --project tests/DynaSharp.IntegrationTests -c Release --no-build

      # The sample is documentation that runs. Running it against both emulators keeps it from rotting.
      - name: Start the sample's emulators
        run: |
          docker compose -f samples/compose.yaml --profile dynamodb-local up -d
          for port in 8000 8001; do
            timeout 60 bash -c "until curl -s -o /dev/null http://localhost:$port; do sleep 1; done"
          done
      - run: dotnet restore samples/DynaSharp.Sample --locked-mode
      - run: dotnet build samples/DynaSharp.Sample -c Release --no-restore
      - name: Sample against Dynoxide
        run: dotnet run --project samples/DynaSharp.Sample -c Release --no-build
      - name: Sample against DynamoDB Local
        run: dotnet run --project samples/DynaSharp.Sample -c Release --no-build
        env:
          AWS_ENDPOINT_URL_DYNAMODB: http://localhost:8001

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: integration-test-results
          path: TestResults/

  aot:
    name: Native AOT smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet publish tests/DynaSharp.AotSmoke -c Release -r linux-x64 -o artifacts/aot
      - run: ./artifacts/aot/DynaSharp.AotSmoke

  # On demand only, out of the path of a pull request or a push, so no job may need this one.
  # One run over everything takes longer than a job may, so each shard mutates one part on its own
  # runner and breaks below 90 % on its own. The fixture of DynaSharp.UnitTests is not mutated.
  mutation:
    name: Mutation testing (${{ matrix.shard }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: fluent
            project: DynaSharp.csproj
            mutate: '**/Fluent/**/*.cs'
          - shard: core
            project: DynaSharp.csproj
            mutate: '!**/Fluent/**/*.cs'
          - shard: generators
            project: DynaSharp.Generators.csproj
            mutate: '**/*.cs'
          - shard: testing
            project: DynaSharp.Testing.csproj
            mutate: '**/*.cs'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - run: dotnet tool restore
      - name: Stryker (break below 90 %)
        run: dotnet stryker --project "${{ matrix.project }}" --mutate "${{ matrix.mutate }}" --reporter markdown --reporter html --reporter progress
      - name: Publish summary
        if: always()
        run: cat StrykerOutput/*/reports/*.md >> "$GITHUB_STEP_SUMMARY" || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutation-report-${{ matrix.shard }}
          path: StrykerOutput/*/reports/
