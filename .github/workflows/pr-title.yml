name: pr-title

# Squash merges turn the PR title into the commit subject that build/next-version.sh reads, so it must be a Conventional
# Commit. A separate workflow, because `edited` (a title change) must re-run this check but not the build.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions: {}

jobs:
  pr-title:
    name: Conventional PR title
    runs-on: ubuntu-latest
    steps:
      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          pattern='^(feat|fix|perf|refactor|docs|test|build|ci|chore|revert)(\([a-z0-9-]+\))?!?: .+'
          if [[ ! "$TITLE" =~ $pattern ]]; then
            echo "::error::PR title must follow Conventional Commits, e.g. 'feat(query): add filter expressions'. Got: '$TITLE'"
            exit 1
          fi
