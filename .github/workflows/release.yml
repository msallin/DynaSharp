name: release

# Releases on demand: run it on main (Actions, release, Run workflow) once the commits to ship are there. It releases the head of
# main only after a green CI run of a push for that commit, derives the version from Conventional Commits, tags, packs and creates a
# GitHub release. A run whose commits warrant no release (only docs, chore, ci, test, ...) does nothing. Publishing to nuget.org runs
# only while the repository variable PUBLISH_TO_NUGET is 'true', in the environment nuget, with NuGet trusted publishing for the user
# NUGET_USER.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Require a green CI run of this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          green=$(gh run list --repo "${{ github.repository }}" --workflow ci.yml --commit "${{ github.sha }}" --event push --status success --json databaseId --jq length)
          if [ "$green" = 0 ]; then echo "::error::No green CI run of a push for ${{ github.sha }}; wait for it, then run the release again."; exit 1; fi

      # The PublicAPI analyzers guard only what Shipped holds, so a release ships its API first: build/ship-public-api.sh moves the
      # lines, committed as chore before the release.
      - name: Require the public API to be marked as shipped
        run: ./build/ship-public-api.sh --check

      - name: Compute next version
        id: version
        run: echo "version=$(./build/next-version.sh)" >> "$GITHUB_OUTPUT"

      # 1.0 is a decision, not the outcome of a breaking commit: until it is taken, a version from 1.0 on stops the release.
      - name: Stay below 1.0
        if: steps.version.outputs.version != ''
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [[ "${VERSION%%.*}" != "0" ]]; then
            echo "::error title=Version ${VERSION}::A release from 1.0 on is not decided yet. Remove this step of .github/workflows/release.yml to release it."
            exit 1
          fi

      # MinVer takes the package version from this tag, so it is set before the pack and pushed only once the packages carry it.
      - name: Tag
        if: steps.version.outputs.version != ''
        run: git tag "v${{ steps.version.outputs.version }}"

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        if: steps.version.outputs.version != ''
        with:
          global-json-file: global.json

      - name: Pack
        if: steps.version.outputs.version != ''
        run: |
          dotnet pack src/DynaSharp -c Release -o artifacts/packages
          dotnet pack src/DynaSharp.Testing -c Release -o artifacts/packages
          dotnet pack src/DynaSharp.Coordination -c Release -o artifacts/packages

      - name: Packages carry the version
        if: steps.version.outputs.version != ''
        run: |
          ls artifacts/packages
          test -f "artifacts/packages/DynaSharp.${{ steps.version.outputs.version }}.nupkg"
          test -f "artifacts/packages/DynaSharp.Testing.${{ steps.version.outputs.version }}.nupkg"
          test -f "artifacts/packages/DynaSharp.Coordination.${{ steps.version.outputs.version }}.nupkg"

      - name: Push the tag
        if: steps.version.outputs.version != ''
        run: git push origin "v${{ steps.version.outputs.version }}"

      - name: GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}" artifacts/packages/*
          --target "${{ github.sha }}" --generate-notes

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.version != ''
        with:
          name: packages
          path: artifacts/packages/

  publish:
    needs: release
    if: needs.release.outputs.version != '' && vars.PUBLISH_TO_NUGET == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # NuGet trusted publishing (OIDC), no stored API key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x # pushing packages does not need the pinned preview SDK
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
