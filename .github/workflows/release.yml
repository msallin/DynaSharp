name: release

# Off for now: nothing is tagged or released, and a manual run skips the job below. To turn releases on, replace the trigger with
# workflow_run on ci for main, types completed. It then runs after a green CI on main: derive the version from Conventional Commits,
# tag, pack, create a GitHub release. Publishing to nuget.org stays off until the repository variable PUBLISH_TO_NUGET is 'true'.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Compute next version
        id: version
        run: echo "version=$(./build/next-version.sh)" >> "$GITHUB_OUTPUT"

      - name: Tag
        if: steps.version.outputs.version != ''
        run: |
          git tag "v${{ steps.version.outputs.version }}"
          git push origin "v${{ steps.version.outputs.version }}"

      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        if: steps.version.outputs.version != ''
        with:
          global-json-file: global.json

      - name: Pack
        if: steps.version.outputs.version != ''
        run: |
          dotnet pack src/DynaSharp -c Release -o artifacts/packages
          dotnet pack src/DynaSharp.Testing -c Release -o artifacts/packages

      - name: GitHub release
        if: steps.version.outputs.version != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "v${{ steps.version.outputs.version }}" artifacts/packages/*
          --target "${{ github.event.workflow_run.head_sha }}" --generate-notes

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.version.outputs.version != ''
        with:
          name: packages
          path: artifacts/packages/

  publish:
    needs: release
    if: needs.release.outputs.version != '' && vars.PUBLISH_TO_NUGET == 'true'
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      id-token: write # NuGet trusted publishing (OIDC), no stored API key
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages
          path: artifacts/packages
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x # pushing packages does not need the pinned preview SDK
      - uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1.2.0
        id: login
        with:
          user: ${{ vars.NUGET_USER }}
      - run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
