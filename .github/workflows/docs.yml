name: docs

# The documentation site at https://msallin.github.io/DynaSharp/: the pages of docs/ and an API reference from the built assemblies.
# Every push and pull request builds it, and only main deploys it.
on:
  pull_request:
  push:
    branches: [main, 'ci/**']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # MinVer needs tags and history

      # DocFX ships a net11.0 build, which runs on the runtime of the SDK that global.json pins, so no second runtime is needed.
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'

      - run: dotnet tool restore
      - run: dotnet restore src/DynaSharp.Testing --locked-mode

      # The API reference is read from the assemblies and their XML docs, not from the projects: DocFX would load them with an MSBuild
      # that does not know the .NET 11 SDK. The output of DynaSharp.Testing holds both assemblies.
      - run: dotnet build src/DynaSharp.Testing -c Release --no-restore

      # The metadata step warns that the Of overloads of MixedExtensions document T1 and T2 twice: DocFX adds what <inheritdoc/> brings to
      # what the member says itself. The pages build with warnings as errors, so a broken link between them fails here.
      - run: dotnet docfx metadata docs/docfx.json
      - run: dotnet docfx build docs/docfx.json --warningsAsErrors

      # The help links of the analyzers point at these anchors, and binaries that have shipped cannot change them.
      - name: Diagnostics page has the anchors of the help links
        run: |
          page=artifacts/site/diagnostics.html
          if [ ! -f "$page" ]; then
            echo "::error::$page is missing"
            exit 1
          fi
          for anchor in entities key-templates commands expressions; do
            if ! grep -q "id=\"$anchor\"" "$page"; then
              echo "::error::$page has no anchor #$anchor"
              exit 1
            fi
          done

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: artifacts/site

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    # One deployment at a time, and one that started finishes: a cancelled deployment can leave the site half updated.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
