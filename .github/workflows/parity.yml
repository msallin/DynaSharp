# Runs the Parity Suite against FakeDynamoDb behind tools/DynaSharp.FakeServer, by hand. A measure, not a gate: the score goes into spec/tasks.md.
name: Parity

on:
  workflow_dispatch:
    inputs:
      tiers:
        description: Tiers of the suite, separated by spaces
        default: tier1 tier2
        required: false

permissions:
  contents: read

jobs:
  parity:
    name: Parity Suite (FakeDynamoDb)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: '**/packages.lock.json'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      - name: Run the suite
        env:
          TIERS: ${{ inputs.tiers }}
        # TIERS stays unquoted on purpose: each tier is one argument.
        run: build/parity.sh $TIERS | tee summary.txt

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: parity-fake
          path: |
            artifacts/parity/fake.json
            artifacts/parity/server.log
            summary.txt
